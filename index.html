<!DOCTYPE html>
<html lang="ru" data-theme="day">
<head>
    <meta charset="UTF-8">
    <script>
    /* Выбор версии экрана.
       1) ?variant=night|dawn|day|sunset — ручная проверка;
       2) ?map=%m — карта, которую подставляет Garry's Mod;
       3) иначе — московское время (как в start.bat).
       ES5: встроенный браузер GMod может быть старым. */
    (function () {
        function param(name) {
            var m = new RegExp('[?&]' + name + '=([^&#]*)').exec(window.location.search);
            if (!m) return '';
            try { return decodeURIComponent(m[1]).toLowerCase(); } catch (e) { return m[1].toLowerCase(); }
        }
        var variant = param('variant');
        var map = param('map');
        if (variant !== 'night' && variant !== 'dawn' && variant !== 'day' && variant !== 'sunset') variant = '';
        if (!variant && map && map.indexOf('%') === -1) {
            if (map.indexOf('night') !== -1) variant = 'night';
            else if (map.indexOf('sunset') !== -1) variant = 'sunset';
            else if (map.indexOf('storm') !== -1 || map.indexOf('dawn') !== -1) variant = 'dawn';
            else variant = 'day';
        }
        if (!variant) {
            var h = new Date(new Date().getTime() + 3 * 3600000).getUTCHours();
            if (h >= 21 || h < 6) variant = 'night';
            else if (h < 9) variant = 'dawn';
            else if (h < 18) variant = 'day';
            else variant = 'sunset';
        }
        document.documentElement.setAttribute('data-theme', variant);
        window.__lampVariant = variant;
    })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAMP ISLAND</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="bg"></div>
    <div class="scrim"></div>

    <div class="ui">
        <header class="header">
            <div class="wordmark">Lamp Island</div>
            <div class="session" id="session">Дневной сеанс</div>
        </header>

        <div class="spacer"></div>

        <div class="bottom">
            <div class="quote">
                <p class="quote__text" id="quoteText">Остров никуда не торопится. И тебе не обязательно.</p>
                <div class="quote__author" id="quoteAuthor">Ламповый остров</div>
            </div>

            <div class="band">
                <div class="band__row">
                    <span class="status" id="status">Подключаемся к острову…</span>
                    <span class="counter" id="counter"></span>
                </div>
                <div class="track is-indeterminate" id="track"><div class="fill" id="fill"></div></div>
                <div class="band__row band__row--bottom">
                    <div class="tip" id="tip">F1 открывает меню сервера.</div>
                    <div class="player">
                        <div class="avatar" id="avatar">
                            <svg class="avatar__fallback" viewBox="0 0 40 40" aria-hidden="true">
                                <circle cx="20" cy="15" r="7"></circle>
                                <path d="M7 36c1.5-8 7-12 13-12s11.5 4 13 12z"></path>
                            </svg>
                            <img class="avatar__img" id="avatarImg" alt="">
                        </div>
                        <div class="player__text">
                            <div class="greet" id="greet">Добро пожаловать на остров</div>
                            <div class="meta" id="meta">Кинотеатр</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="credit">lamp island · ламповый остров</div>
        </div>
    </div>

    <script src="js/loading.js"></script>
</body>
</html>
